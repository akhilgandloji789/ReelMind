name: ReelMind Backend Keep-Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier from sleeping after 15 min
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab to test anytime

jobs:
  ping-render:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive HTTP Ping
        run: |
          echo "Pinging ReelMind Cloud Backend on Render..."
          RESPONSE=$(curl -sS -L \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36 ReelMind-KeepAlive" \
            -w "\n%{http_code}" \
            "https://reelmind-hxh2.onrender.com/api/health")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          
          echo "HTTP Response Status: $HTTP_STATUS"
          echo "HTTP Body: $HTTP_BODY"
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ ReelMind Backend is healthy, awake, and ready!"
            exit 0
          else
            echo "❌ Keep-alive ping failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
